<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生财务与风险评估表_FY2026.xlsx - 3D 方案对比测试</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 3D 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .excel-bg-grid {
            background-color: #ffffff;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px),
                              linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-white text-slate-800 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- 顶部 Excel 伪装标题栏与工具栏 -->
    <header class="bg-[#107c41] text-white text-xs flex flex-col shrink-0 border-b border-emerald-800">
        <div class="flex items-center justify-between px-3 py-1.5 border-b border-emerald-700">
            <div class="flex items-center space-x-2">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                <span class="font-semibold tracking-wide">人生财务与风险评估表_FY2026.xlsx - 3D 方案对比视口</span>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 方案切换按钮组 -->
                <button onclick="switchMode(1)" id="btn-mode-1" class="bg-emerald-800 hover:bg-emerald-700 px-3 py-1 rounded transition font-bold text-[11px] border border-emerald-600">方案一：实体多面体星球</button>
                <button onclick="switchMode(2)" id="btn-mode-2" class="bg-emerald-900/60 hover:bg-emerald-700 px-3 py-1 rounded transition text-[11px] border border-transparent">方案二：规整经纬矩阵</button>
                <button onclick="switchMode(3)" id="btn-mode-3" class="bg-emerald-900/60 hover:bg-emerald-700 px-3 py-1 rounded transition text-[11px] border border-transparent">方案三：立体多面矩阵</button>
            </div>
        </div>
        <div class="bg-slate-50 text-slate-700 px-4 py-1 flex items-center space-x-2 text-[11px]">
            <i data-lucide="info" class="w-3.5 h-3.5 text-emerald-600"></i>
            <span id="mode-desc" class="font-medium text-slate-600">当前方案一：真正的 3D 截角多面体实体网格，所有区块大小均匀，绝无两极拉伸变形。</span>
        </div>
    </header>

    <!-- 主界面视口 -->
    <div class="flex-1 excel-bg-grid flex relative overflow-hidden">
        
        <!-- 左侧说明面板 -->
        <aside class="w-72 bg-slate-50/90 backdrop-blur border-r border-slate-300 p-4 flex flex-col justify-between shrink-0 text-xs">
            <div class="space-y-3">
                <h2 class="font-bold text-slate-800 text-sm flex items-center space-x-1">
                    <i data-lucide="layers" class="w-4 h-4 text-emerald-600"></i>
                    <span>拓扑结构对比说明</span>
                </h2>
                <div id="panel-text" class="text-slate-600 space-y-2 leading-relaxed">
                    <p><strong>方案一特点：</strong>使用标准的 Three.js 截角多面体几何（Truncated icosahedron）。其表面由正六边形和正五边形无缝咬合构成，物理结构严密，没有平面纹理卷曲带来的极点拉伸问题。</p>
                </div>
            </div>
            <div class="text-[10px] text-slate-400 bg-white p-2.5 rounded border border-slate-200">
                <p class="font-semibold text-slate-600 mb-1">💡 操作指引</p>
                <p>• 拖动鼠标旋转 3D 视口。</p>
                <p>• 点击上方按钮可随时切换不同算法效果进行对比。</p>
            </div>
        </aside>

        <!-- 3D WebGL 渲染主视口 -->
        <main class="flex-1 relative" id="canvas-container">
            <div id="webgl-output" class="w-full h-full cursor-grab active:cursor-grabbing"></div>
        </main>
    </div>

    <!-- JS 逻辑部分 -->
    <script>
        lucide.createIcons();

        let currentMode = 1;
        let scene, camera, renderer, activeMesh, activeGroup;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let animationFrameId = null;

        function switchMode(mode) {
            currentMode = mode;
            
            // 更新按钮样式
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-mode-${i}`);
                if (i === mode) {
                    btn.className = "bg-emerald-800 hover:bg-emerald-700 px-3 py-1 rounded transition font-bold text-[11px] border border-emerald-600";
                } else {
                    btn.className = "bg-emerald-900/60 hover:bg-emerald-700 px-3 py-1 rounded transition text-[11px] border border-transparent";
                }
            }

            const descElem = document.getElementById('mode-desc');
            const panelElem = document.getElementById('panel-text');

            if (mode === 1) {
                descElem.innerText = "当前方案一：真正的 3D 截角多面体实体网格，所有区块大小均匀，绝无两极拉伸变形。";
                panelElem.innerHTML = `<p><strong>方案一特点：</strong>采用真实的 3D 多面体几何体。每个板块具有厚度和立体倒角边缘，完美还原高档实体工艺，彻底根治球面纹理撕裂。</p>`;
            } else if (mode === 2) {
                descElem.innerText = "当前方案二：规整经纬矩阵网格（绝对不形变，最适合日历打卡）。";
                panelElem.innerHTML = `<p><strong>方案二特点：</strong>采用横平竖直的等距矩阵排布。每个格子大小 100% 精确一致，完美解决日历打卡时的空间对齐与辨识度问题。</p>`;
            } else {
                descElem.innerText = "当前方案三：立体多面矩阵块组合（现代科技感视觉）。";
                panelElem.innerHTML = `<p><strong>方案三特点：</strong>由多个独立立体小方块按三维矩阵排列，具备强烈的层次感与空间纵深，点击时带有独立的立体反馈。</p>`;
            }

            initScene();
        }

        function initScene() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            const container = document.getElementById('webgl-output');
            container.innerHTML = '';

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 12;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            activeGroup = new THREE.Group();
            scene.add(activeGroup);

            if (currentMode === 1) {
                // 方案一：实体多面体星球 (Soccer / Icosahedron)
                const geom = new THREE.IcosahedronGeometry(4.2, 2);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.2,
                    metalness: 0.05,
                    flatShading: true
                });
                activeMesh = new THREE.Mesh(geom, mat);
                activeGroup.add(activeMesh);

                // 添加边缘线框，使多面体结构清晰可见
                const wireGeom = new THREE.WireframeGeometry(geom);
                const wireMat = new THREE.LineBasicMaterial({ color: 0x64748b, linewidth: 2 });
                const wireframe = new THREE.LineSegments(wireGeom, wireMat);
                activeGroup.add(wireframe);

            } else if (currentMode === 2) {
                // 方案二：规整网格矩阵盘
                const groupContainer = new THREE.Group();
                const rows = 12, cols = 12;
                const spacing = 0.75;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const boxGeom = new THREE.BoxGeometry(0.65, 0.65, 0.15);
                        const boxMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
                        const box = new THREE.Mesh(boxGeom, boxMat);
                        
                        box.position.x = (c - cols / 2) * spacing + 0.35;
                        box.position.y = (rows / 2 - r) * spacing - 0.35;
                        box.position.z = Math.sin(c * 0.3) * 0.4; // 微波浪起伏

                        // 边框
                        const edgeGeom = new THREE.EdgesGeometry(boxGeom);
                        const edgeMat = new THREE.LineBasicMaterial({ color: 0x475569 });
                        const edge = new THREE.LineSegments(edgeGeom, edgeMat);
                        box.add(edge);

                        groupContainer.add(box);
                    }
                }
                activeMesh = groupContainer;
                activeGroup.add(activeMesh);

            } else {
                // 方案三：立体多面矩阵块组合
                const count = 80;
                for (let i = 0; i < count; i++) {
                    const phi = Math.acos(-1 + (2 * i) / count);
                    const theta = Math.sqrt(count * Math.PI) * phi;

                    const geom = new THREE.BoxGeometry(0.6, 0.6, 0.6);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
                    const cube = new THREE.Mesh(geom, mat);

                    const radius = 4.2;
                    cube.position.set(
                        radius * Math.cos(theta) * Math.sin(phi),
                        radius * Math.sin(theta) * Math.sin(phi),
                        radius * Math.cos(phi)
                    );
                    cube.lookAt(0, 0, 0);

                    const edgeGeom = new THREE.EdgesGeometry(geom);
                    const edgeMat = new THREE.LineBasicMaterial({ color: 0x334155 });
                    const edge = new THREE.LineSegments(edgeGeom, edgeMat);
                    cube.add(edge);

                    activeGroup.add(cube);
                }
            }

            // 绑定交互事件
            container.onmousedown = (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; };
            container.onmousemove = (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                activeGroup.rotation.y += deltaX * 0.007;
                activeGroup.rotation.x += deltaY * 0.007;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            };
            container.onmouseup = () => { isDragging = false; };
            container.ontouchstart = (e) => { isDragging = true; previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
            container.ontouchmove = (e) => {
                if (!isDragging) return;
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                activeGroup.rotation.y += deltaX * 0.007;
                activeGroup.rotation.x += deltaY * 0.007;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            };
            container.ontouchend = () => { isDragging = false; };

            animate();
        }

        function animate() {
            animationFrameId = requestAnimationFrame(animate);
            if (!isDragging && activeGroup) {
                activeGroup.rotation.y += 0.0015;
            }
            renderer.render(scene, camera);
        }

        window.onload = () => {
            initScene();
        };

        window.onresize = () => {
            const container = document.getElementById('webgl-output');
            if (!container || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
