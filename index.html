<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生财务与风险评估表_FY2026.xlsx - 365天自适应多面体方案</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 3D 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .excel-bg-grid {
            background-color: #ffffff;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px),
                              linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-white text-slate-800 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- 顶部 Excel 伪装标题栏与工具栏 -->
    <header class="bg-[#107c41] text-white text-xs flex flex-col shrink-0 border-b border-emerald-800">
        <div class="flex items-center justify-between px-3 py-1.5 border-b border-emerald-700">
            <div class="flex items-center space-x-2">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                <span class="font-semibold tracking-wide">人生财务与风险评估表_FY2026.xlsx - 365天多面体对比</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="switchMode(1)" id="btn-mode-1" class="bg-emerald-800 hover:bg-emerald-700 px-3 py-1 rounded transition font-bold text-[11px] border border-emerald-600">方案一：365块立体多面体球</button>
                <button onclick="switchMode(2)" id="btn-mode-2" class="bg-emerald-900/60 hover:bg-emerald-700 px-3 py-1 rounded transition text-[11px] border border-transparent">方案二：365块多面体弧形墙</button>
                <button onclick="switchMode(3)" id="btn-mode-3" class="bg-emerald-900/60 hover:bg-emerald-700 px-3 py-1 rounded transition text-[11px] border border-transparent">方案三：365块紧凑魔方环</button>
            </div>
        </div>
        <div class="bg-slate-50 text-slate-700 px-4 py-1 flex items-center space-x-2 text-[11px]">
            <i data-lucide="calendar" class="w-3.5 h-3.5 text-emerald-600"></i>
            <span id="mode-desc" class="font-medium text-slate-600">加载中...</span>
        </div>
    </header>

    <!-- 主界面视口 -->
    <div class="flex-1 excel-bg-grid flex relative overflow-hidden">
        
        <!-- 左侧说明面板 -->
        <aside class="w-72 bg-slate-50/90 backdrop-blur border-r border-slate-300 p-4 flex flex-col justify-between shrink-0 text-xs">
            <div class="space-y-3">
                <h2 class="font-bold text-slate-800 text-sm flex items-center space-x-1">
                    <i data-lucide="box" class="w-4 h-4 text-emerald-600"></i>
                    <span>365 天参数统计</span>
                </h2>
                <div id="panel-text" class="text-slate-600 space-y-2 leading-relaxed"></div>
            </div>
            <div class="text-[10px] text-slate-400 bg-white p-2.5 rounded border border-slate-200 space-y-1">
                <p class="font-semibold text-slate-600">💡 提示</p>
                <p>三套方案均已自适应为你今年的 <strong>365 个独立 3D 多面体实体块</strong>。</p>
            </div>
        </aside>

        <!-- 3D WebGL 渲染视口 -->
        <main class="flex-1 relative" id="canvas-container">
            <div id="webgl-output" class="w-full h-full cursor-grab active:cursor-grabbing"></div>
        </main>
    </div>

    <!-- JS 逻辑部分 -->
    <script>
        lucide.createIcons();

        let currentMode = 1;
        let scene, camera, renderer, activeGroup;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let animationFrameId = null;

        const TOTAL_DAYS = 365;

        function switchMode(mode) {
            currentMode = mode;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-mode-${i}`);
                btn.className = (i === mode) 
                    ? "bg-emerald-800 hover:bg-emerald-700 px-3 py-1 rounded transition font-bold text-[11px] border border-emerald-600"
                    : "bg-emerald-900/60 hover:bg-emerald-700 px-3 py-1 rounded transition text-[11px] border border-transparent";
            }

            const descElem = document.getElementById('mode-desc');
            const panelElem = document.getElementById('panel-text');

            if (mode === 1) {
                descElem.innerText = "方案一：由 365 个真正的独立 3D 实体多面体块均匀分布组成的星球，无两极拉伸。";
                panelElem.innerHTML = `<p><strong>365 阶多面体星球：</strong>精确计算了 365 个独立 3D 多面体切块在球面上的几何分布。无缝咬合，每一个块都是立体的。</p>`;
            } else if (mode === 2) {
                descElem.innerText = "方案二：365 块多面体实体组成的微弧立体日历墙，横平竖直。";
                panelElem.innerHTML = `<p><strong>365 块多面体弧形墙：</strong>将 365 天按 19x20 规整矩阵多面体排列，带有 3D 实体凸起倒角，彻底解决无缝对齐问题。</p>`;
            } else {
                descElem.innerText = "方案三：365 块无间隙紧凑立方体魔方阵列，告别空旷感。";
                panelElem.innerHTML = `<p><strong>365 块紧凑魔方环：</strong>缩小了间距，让 365 个 3D 立方块无缝紧密拼接成环状多面体，充满立体科技感。</p>`;
            }

            initScene();
        }

        function initScene() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            const container = document.getElementById('webgl-output');
            container.innerHTML = '';

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 13;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            activeGroup = new THREE.Group();
            scene.add(activeGroup);

            if (currentMode === 1) {
                // 方案一：365 个实体 3D 六边形/多面体小块在球面上分布
                const phiRatio = (1 + Math.sqrt(5)) / 2;
                const radius = 4.3;

                for (let i = 0; i < TOTAL_DAYS; i++) {
                    const theta = 2 * Math.PI * i / phiRatio;
                    const phi = Math.acos(1 - 2 * (i + 0.5) / TOTAL_DAYS);

                    const x = radius * Math.sin(phi) * Math.cos(theta);
                    const y = radius * Math.cos(phi);
                    const z = radius * Math.sin(phi) * Math.sin(theta);

                    // 创建 3D 多面体小柱体
                    const geom = new THREE.CylinderGeometry(0.24, 0.24, 0.08, 6);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
                    const mesh = new THREE.Mesh(geom, mat);

                    mesh.position.set(x, y, z);
                    mesh.lookAt(x * 2, y * 2, z * 2);
                    mesh.rotateX(Math.PI / 2);

                    const edgeGeom = new THREE.EdgesGeometry(geom);
                    const edgeMat = new THREE.LineBasicMaterial({ color: 0x475569 });
                    mesh.add(new THREE.LineSegments(edgeGeom, edgeMat));

                    activeGroup.add(mesh);
                }

            } else if (currentMode === 2) {
                // 方案二：365 块多面体实体组成 19x20 的规整多面体弧形墙
                const cols = 20;
                const rows = Math.ceil(TOTAL_DAYS / cols);
                const spacingX = 0.42;
                const spacingY = 0.42;

                for (let i = 0; i < TOTAL_DAYS; i++) {
                    const c = i % cols;
                    const r = Math.floor(i / cols);

                    const geom = new THREE.BoxGeometry(0.38, 0.38, 0.12);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 });
                    const mesh = new THREE.Mesh(geom, mat);

                    const posX = (c - cols / 2) * spacingX + 0.2;
                    const posY = (rows / 2 - r) * spacingY - 0.2;
                    // 微弧度，增加多面体空间感
                    const posZ = -Math.pow(posX * 0.15, 2); 

                    mesh.position.set(posX, posY, posZ);

                    const edgeGeom = new THREE.EdgesGeometry(geom);
                    const edgeMat = new THREE.LineBasicMaterial({ color: 0x334155 });
                    mesh.add(new THREE.LineSegments(edgeGeom, edgeMat));

                    activeGroup.add(mesh);
                }

            } else {
                // 方案三：365 块紧密相连无空隙的 3D 魔方圆环
                const radius = 4.2;
                const layers = 15;
                const perLayer = Math.ceil(TOTAL_DAYS / layers);

                for (let i = 0; i < TOTAL_DAYS; i++) {
                    const layer = Math.floor(i / perLayer);
                    const indexInLayer = i % perLayer;

                    const angle = (indexInLayer / perLayer) * Math.PI * 2;
                    const h = (layer - layers / 2) * 0.42;

                    const x = radius * Math.cos(angle);
                    const z = radius * Math.sin(angle);
                    const y = h;

                    const geom = new THREE.BoxGeometry(0.38, 0.38, 0.15);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
                    const cube = new THREE.Mesh(geom, mat);

                    cube.position.set(x, y, z);
                    cube.lookAt(0, y, 0);

                    const edgeGeom = new THREE.EdgesGeometry(geom);
                    const edgeMat = new THREE.LineBasicMaterial({ color: 0x475569 });
                    cube.add(new THREE.LineSegments(edgeGeom, edgeMat));

                    activeGroup.add(cube);
                }
            }

            // 拖动旋转交互
            container.onmousedown = (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; };
            container.onmousemove = (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                activeGroup.rotation.y += deltaX * 0.007;
                activeGroup.rotation.x += deltaY * 0.007;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            };
            container.onmouseup = () => { isDragging = false; };
            container.ontouchstart = (e) => { isDragging = true; previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
            container.ontouchmove = (e) => {
                if (!isDragging) return;
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                activeGroup.rotation.y += deltaX * 0.007;
                activeGroup.rotation.x += deltaY * 0.007;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            };
            container.ontouchend = () => { isDragging = false; };

            animate();
        }

        function animate() {
            animationFrameId = requestAnimationFrame(animate);
            if (!isDragging && activeGroup) {
                activeGroup.rotation.y += 0.0015;
            }
            renderer.render(scene, camera);
        }

        window.onload = () => { initScene(); };
        window.onresize = () => {
            const container = document.getElementById('webgl-output');
            if (!container || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        };
    </script>
</body>
</html>
