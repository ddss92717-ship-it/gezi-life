<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格子人生：单机RPG命运卷轴 - RPG Demo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&display=swap');
        
        .font-rpg {
            font-family: 'Noto Serif SC', serif;
        }
        
        .pixel-border {
            border: 4px solid #334155;
            box-shadow: 4px 4px 0px #0f172a;
        }

        .dialog-box {
            background: rgba(15, 23, 42, 0.92);
            border: 3px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .choice-btn {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #475569;
            transition: all 0.2s ease;
        }
        .choice-btn:hover {
            border-color: #38bdf8;
            background: linear-gradient(135deg, #0369a1 0%, #0c4a6e 100%);
            transform: translateX(4px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden select-none">

    <!-- 顶部单机状态栏 -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <span class="text-sky-400 font-rpg text-lg font-bold flex items-center gap-1.5">
                <i data-lucide="compass" class="w-5 h-5"></i>
                《格子人生：命运卷轴》RPG 演示版
            </span>
            <span id="scene-badge" class="bg-sky-950 text-sky-300 border border-sky-800 text-xs px-2.5 py-0.5 rounded-full font-mono">
                地图：幸福小镇 (幼年期)
            </span>
        </div>
        <div class="flex items-center space-x-6 text-xs">
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400">当前年龄:</span>
                <span id="rpg-age" class="text-amber-400 font-bold font-mono text-sm">0 岁</span>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400">生命值 (HP):</span>
                <div class="w-24 bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                    <div id="rpg-bar-hp" class="bg-rose-500 h-full transition-all" style="width: 100%"></div>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400">精神力 (SAN):</span>
                <div class="w-24 bg-slate-800 h-2 rounded-full overflow-hidden border border-slate-700">
                    <div id="rpg-bar-san" class="bg-amber-400 h-full transition-all" style="width: 100%"></div>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <span class="text-slate-400">金币:</span>
                <span id="rpg-cash" class="text-emerald-400 font-bold font-mono">￥ 0</span>
            </div>
        </div>
    </header>

    <!-- 主视角：RPG Canvas 画面 + 对话交互区 -->
    <main class="flex-1 flex flex-col relative overflow-hidden bg-slate-900">
        
        <!-- 2D/3D RPG 画布（模拟游戏地图与小人移动） -->
        <div class="flex-1 relative" id="rpg-world">
            <canvas id="rpg-canvas" class="w-full h-full block"></canvas>
            
            <!-- NPC / 主角动态环境提示框 -->
            <div id="world-toast" class="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-sky-500/50 text-sky-200 text-xs px-4 py-1.5 rounded-full shadow-lg pointer-events-none transition-all duration-300 opacity-0">
                按“前进”或点击路线推进主角的命运...
            </div>
        </div>

        <!-- 底部 RPG 单机经典剧情与对话面板 (Sword and Fairy Style) -->
        <div class="h-64 border-t-2 border-sky-500/30 dialog-box p-4 flex flex-col justify-between shrink-0 relative z-30">
            <!-- 说话者标识 -->
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-sky-400 animate-pulse"></span>
                    <span id="dialog-speaker" class="font-rpg font-bold text-sky-300 text-base">系统引路人</span>
                    <span id="dialog-tag" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded">主线剧情</span>
                </div>
                <div id="quest-tracker" class="text-xs text-amber-300 font-mono">
                    主线目标：踏出人生的第一步
                </div>
            </div>

            <!-- 对话内容文本 -->
            <div class="my-2 text-sm text-slate-200 leading-relaxed font-sans" id="dialog-text">
                欢迎来到《格子人生：命运卷轴》。你将以第一视角操纵主角度过从 0 岁到 80 岁的人生。每一次决定都将永久改变后续地图与NPC对你的态度。
            </div>

            <!-- 决策分支与操作按钮区 -->
            <div class="grid grid-cols-2 gap-3" id="dialog-options">
                <!-- 动态生成 RPG 分支按键 -->
            </div>
        </div>
    </main>

    <!-- 游戏结束审计/轮回面板 -->
    <div id="modal-rpg-end" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-sky-500 rounded-xl max-w-lg w-full p-6 space-y-4 text-xs font-sans">
            <h2 class="text-xl font-rpg font-bold text-sky-400 text-center border-b border-slate-800 pb-3">
                卷轴收拢 · 一生命运终局
            </h2>
            <div class="space-y-2 text-slate-300" id="rpg-summary-content">
                <!-- 动态加载一生终局回顾 -->
            </div>
            <div class="pt-4 border-t border-slate-800 flex justify-center">
                <button onclick="location.reload()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-6 py-2 rounded-lg transition">
                    开启下一世轮回 (重开局)
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // 玩家 RPG 核心状态
        let player = {
            age: 0,
            hp: 100,
            san: 100,
            cash: 0,
            int: 10,
            pts: 10,
            stage: 0, // 0: 幸福小镇, 1: 大都市写字楼, 2: 郊区公园
            storyFlags: {} // 储存草蛇灰线因果标记（如：是否帮助过同桌、是否与父母缓和关系）
        };

        // Canvas 地图与角色渲染引擎
        const canvas = document.getElementById('rpg-canvas');
        const ctx = canvas.getContext('2d');
        let playerX = 100;
        let playerY = 0;
        let targetX = 100;
        let animFrame;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            playerY = canvas.height / 2 + 20;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 绘制 RPG 像素大地图场景
        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 背景天空与渐变
            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            if (player.stage === 0) {
                // 幼年：金黄晨光小镇
                bgGrad.addColorStop(0, '#0284c7');
                bgGrad.addColorStop(1, '#0f172a');
            } else if (player.stage === 1) {
                // 青年：赛博霓虹都市
                bgGrad.addColorStop(0, '#1e1b4b');
                bgGrad.addColorStop(1, '#020617');
            } else {
                // 老年：静谧枫林夕阳
                bgGrad.addColorStop(0, '#7c2d12');
                bgGrad.addColorStop(1, '#0f172a');
            }
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 绘制地面道路
            ctx.fillStyle = player.stage === 1 ? '#1e293b' : '#334155';
            ctx.fillRect(0, canvas.height / 2 + 50, canvas.width, canvas.height / 2);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, canvas.height / 2 + 50, canvas.width, canvas.height / 2);

            // 3. 绘制地图建筑与风景标示
            drawBuildings();

            // 4. 移动动画更新
            if (Math.abs(playerX - targetX) > 2) {
                playerX += (targetX - playerX) * 0.08;
            }

            // 5. 绘制主角小人（带简易跑动波纹）
            ctx.save();
            ctx.fillStyle = '#38bdf8';
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(playerX, playerY, 16, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(playerX + 5, playerY - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 角色头顶名牌与年龄
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`主角 (${player.age}岁)`, playerX, playerY - 24);

            animFrame = requestAnimationFrame(renderScene);
        }

        function drawBuildings() {
            if (player.stage === 0) {
                // 幸福小镇：小屋与学校
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(180, canvas.height / 2 - 40, 90, 90);
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('🏡 温暖家园', 225, canvas.height / 2 - 50);

                ctx.fillStyle = '#0369a1';
                ctx.fillRect(500, canvas.height / 2 - 70, 140, 120);
                ctx.fillStyle = '#7dd3fc';
                ctx.fillText('🏫 第一小学', 570, canvas.height / 2 - 80);
            } else if (player.stage === 1) {
                // 赛博都市：写字楼与出租屋
                ctx.fillStyle = '#312e81';
                ctx.fillRect(200, canvas.height / 2 - 120, 100, 170);
                ctx.fillStyle = '#818cf8';
                ctx.fillText('🏢 大厂写字楼', 250, canvas.height / 2 - 130);

                ctx.fillStyle = '#4338ca';
                ctx.fillRect(520, canvas.height / 2 - 90, 120, 140);
                ctx.fillStyle = '#a5b4fc';
                ctx.fillText('🏬 商业中心', 580, canvas.height / 2 - 100);
            } else {
                // 晚年公园
                ctx.fillStyle = '#065f46';
                ctx.beginPath();
                ctx.arc(300, canvas.height / 2, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#34d399';
                ctx.fillText('🌳 银杏公园', 300, canvas.height / 2 - 60);
            }
        }

        // 单机 RPG 剧本路线节点库（支持因果连锁与分支结局）
        const rpgStoryTree = {
            start: {
                speaker: '抓周仪式 (0 岁)',
                tag: '命运起点',
                quest: '主线：选择你的初始天赋偏好',
                text: '伴随着清脆的啼哭声，你降生在了一户普通的工薪家庭。满月抓周宴上，长辈在红毯上摆满了物品，拭目以待。',
                options: [
                    { text: '伸手抓起【彩色算盘】', effect: '智力+5, 资金+1000', next: 'childhood_school', action: () => { player.int += 5; player.cash += 1000; } },
                    { text: '一把抱住【故事绘本】', effect: '快乐+10, 声望+5', next: 'childhood_school', action: () => { player.san += 10; player.pts += 5; } }
                ]
            },
            childhood_school: {
                speaker: '班主任王老师 (12 岁)',
                tag: '小升初事件',
                quest: '主线：面对校园人际与学术考验',
                text: '初中入学第一周，你看到同桌因性格内向正被几个高年级学生堵在后门言语欺凌。你打算：',
                options: [
                    { 
                        text: '挺身而出帮同桌解围', 
                        effect: '声望+15, 结下深刻羁绊', 
                        next: 'gaokao_choice', 
                        action: () => { 
                            player.pts += 15; 
                            player.storyFlags['helped_friend'] = true; // 埋下草蛇灰线伏笔！
                        } 
                    },
                    { 
                        text: '默默回教室报告老师', 
                        effect: '智力+5, 稳健避险', 
                        next: 'gaokao_choice', 
                        action: () => { 
                            player.int += 5; 
                            player.storyFlags['helped_friend'] = false;
                        } 
                    }
                ]
            },
            gaokao_choice: {
                speaker: '高考志愿填报 (18 岁)',
                tag: '命运转折',
                quest: '主线：选择人生的职业道路',
                text: '高考成绩公布！你的分数刚好踏上了重点本科线。面对专业大类，你决定：',
                options: [
                    { 
                        text: '报读热门计算机大类 (内卷路线)', 
                        effect: '智力+20, 移步赛博都市地图', 
                        next: 'adult_career', 
                        action: () => { 
                            player.int += 20; 
                            player.stage = 1; // 切换到都市地图！
                            targetX = 250;
                        } 
                    },
                    { 
                        text: '选择公费师范/编制方向 (求稳路线)', 
                        effect: '快乐+15, 编制稳定', 
                        next: 'adult_career', 
                        action: () => { 
                            player.san += 15; 
                            player.stage = 1;
                            targetX = 580;
                        } 
                    }
                ]
            },
            adult_career: {
                speaker: '大厂 HR / 部门总监 (35 岁)',
                tag: '中年危机事件',
                quest: '主线：应对行业优化黑天鹅',
                text: () => {
                    // 检查 12 岁时埋下的伏笔！
                    if (player.storyFlags['helped_friend']) {
                        return '公司爆发大裁员！正当你忧心忡忡时，当年你帮助过的同桌突然打来电话：“听说你们部门在优化？我现在在创业公司当CTO，过来做架构师吧！” (触发当年善意因果彩蛋)';
                    } else {
                        return '行业迎来寒冬，HR 找你谈话表示部门面临整体裁撤，给出了 N+1 赔偿方案。你站在立交桥上感到了前所未有的迷茫。';
                    }
                },
                options: [
                    { 
                        text: '接受邀请/跳槽重新出发', 
                        effect: '资金+50,000, 移步晚年', 
                        next: 'elder_retirement', 
                        action: () => { 
                            player.cash += 50000; 
                            player.stage = 2; // 切换到晚年地图
                            targetX = 300;
                        } 
                    },
                    { 
                        text: '拿赔偿金回老家开启惬意副业', 
                        effect: 'SAN+30, 享受生活', 
                        next: 'elder_retirement', 
                        action: () => { 
                            player.san += 30; 
                            player.stage = 2;
                            targetX = 300;
                        } 
                    }
                ]
            },
            elder_retirement: {
                speaker: '晚年公园长椅 (75 岁)',
                tag: '终局收卷',
                quest: '主线：回味一生风雨',
                text: '夕阳斜照在公园的枫叶上。你坐在长椅上，看着远处的年轻人，回顾这一生的起起落落...',
                options: [
                    { 
                        text: '闭目体味这一生的满足与安宁', 
                        effect: '生成终局 RPG 档案', 
                        next: 'END', 
                        action: () => { triggerRPGEnd(); } 
                    }
                ]
            }
        };

        // 推进 RPG 剧本与分支
        function loadStoryNode(nodeKey) {
            const node = rpgStoryTree[nodeKey];
            if (!node) return;

            document.getElementById('dialog-speaker').innerText = node.speaker;
            document.getElementById('dialog-tag').innerText = node.tag;
            document.getElementById('quest-tracker').innerText = node.quest;

            // 支持动态文本
            document.getElementById('dialog-text').innerText = typeof node.text === 'function' ? node.text() : node.text;

            const optionsBox = document.getElementById('dialog-options');
            optionsBox.innerHTML = '';

            node.options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn text-left p-3 rounded-lg text-xs flex flex-col justify-between';
                btn.innerHTML = `
                    <span class="font-bold text-sky-200">${opt.text}</span>
                    <span class="text-[10px] text-emerald-400 font-mono mt-1">影响: ${opt.effect}</span>
                `;
                btn.onclick = () => {
                    if (opt.action) opt.action();
                    player.age += 15; // 剧情推进时间
                    updateRPGStats();
                    showWorldToast(`✨ 推进至 ${player.age} 岁 | ${opt.effect}`);
                    
                    if (opt.next === 'END') {
                        triggerRPGEnd();
                    } else {
                        loadStoryNode(opt.next);
                    }
                };
                optionsBox.appendChild(btn);
            });

            // 更新地图场景标识
            const sceneBadges = ['幸福小镇 (幼年期)', '赛博都市 (青年期)', '静谧枫林 (老年期)'];
            document.getElementById('scene-badge').innerText = `地图：${sceneBadges[player.stage]}`;
        }

        function updateRPGStats() {
            document.getElementById('rpg-age').innerText = `${player.age} 岁`;
            document.getElementById('rpg-cash').innerText = `￥ ${player.cash.toLocaleString()}`;
            document.getElementById('rpg-bar-hp').style.width = `${Math.max(0, player.hp)}%`;
            document.getElementById('rpg-bar-san').style.width = `${Math.max(0, player.san)}%`;
        }

        function showWorldToast(msg) {
            const toast = document.getElementById('world-toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function triggerRPGEnd() {
            const modal = document.getElementById('modal-rpg-end');
            const summary = document.getElementById('rpg-summary-content');
            
            summary.innerHTML = `
                <div class="bg-slate-950 p-3 rounded border border-slate-800 space-y-1">
                    <p>【主角终局状态】：<span class="text-amber-400 font-bold">${player.age} 岁圆满离场</span></p>
                    <p>【积攒财富总额】：<span class="text-emerald-400 font-bold">￥ ${player.cash.toLocaleString()}</span></p>
                    <p>【智力积累 (INT)】：${player.int} | 【社会声望 (PTS)】：${player.pts}</p>
                </div>
                <p class="italic text-slate-400 leading-relaxed pt-2">
                    “你在小镇抓过周，在学校帮过同桌，在都市写字楼里拼搏过，也在公园的夕阳下笑看红尘。你没有留下遗憾，这便是属于你独一无二的传奇一生。”
                </p>
            `;
            modal.classList.remove('hidden');
        }

        // 初始化游戏
        window.onload = () => {
            renderScene();
            loadStoryNode('start');
            updateRPGStats();
        };
    </script>
</body>
</html>
